name = "my-portal-vault-proxy"
main = "src/index.js"
compatibility_date = "2026-09-24"

# knowledgenote.work は Cloudflare 管理下（2026-09-24 ネームサーバー移行済み）。
# サブドメイン api.knowledgenote.work にこの Worker を紐付ける。
routes = [
  { pattern = "api.knowledgenote.work", custom_domain = true }
]

[vars]
GITHUB_REPO = "kabotyabon/my-portal-vault"
GITHUB_BRANCH = "main"
# 公開アプリ（GitHub Pages）と、将来のNext.js版のドメインをカンマ区切りで並べる。
# ここに無い Origin からのリクエストは CORS で弾かれる（X-Portal-Key を知っていても）。
ALLOWED_ORIGINS = "https://kabotyabon.github.io,https://knowledgenote.work"

# 以下は Secret（このファイルには書かない。`wrangler secret put <NAME>` で個別に登録する）:
#   GITHUB_PAT     … my-portal-vault への Contents:write を持つ PAT
#   PORTAL_API_KEY … アプリ⇄Worker間の合言葉（例: openssl rand -hex 32 で生成）
