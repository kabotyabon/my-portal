<!-- 過去の日記・ナレッジ（スマホでは日記タブの「過去」セグメント） -->
<div id="main-panel-archive" class="is-hidden">

  <p class="sheet-date">ARCHIVE</p>
  <div style="display:flex;align-items:baseline;gap:10px;">
    <h3 class="sheet-heading">過去の記録</h3>
    <span style="flex:1;"></span>
    <span id="archive-breadcrumb" style="font-size:11.5px;color:var(--text-faint);"></span>
  </div>

  <hr class="sheet-rule">

  <div class="report-tabs" id="archive-root-tabs" style="margin-bottom:12px;"></div>

  <!-- 新規ファイル追加（表示中のディレクトリに作成する）。
       一覧はスクロールで長くなるため、追加行は一覧の上に置く -->
  <div class="archive-add-row" id="archive-add-row">
    <input id="archive-new-name" type="text" class="quick-memo-input" style="flex:1;min-width:0;"
      placeholder="新しいファイル名"
      onkeydown="if(event.key==='Enter')createArchiveFile()">
    <button class="quick-memo-btn" id="archive-add-btn" onclick="createArchiveFile()">＋ 追加</button>
  </div>

  <div id="archive-list" class="archive-list"></div>

  <div id="archive-editor-wrap" class="is-hidden" style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border);">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;flex-wrap:wrap;">
      <strong id="archive-file-title" style="font-size:13px;word-break:break-all;color:var(--text);"></strong>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="report-tabs">
          <button class="report-tab tab active" id="archive-tab-preview" onclick="switchArchiveTab('preview')">プレビュー</button>
          <button class="report-tab tab" id="archive-tab-edit" onclick="switchArchiveTab('edit')">編集</button>
        </div>
        <button class="btn-quiet" onclick="closeArchiveFile()">閉じる</button>
      </div>
    </div>

    <div id="archive-preview" class="report-preview"></div>

    <div id="archive-edit" class="is-hidden">
      <textarea id="archive-textarea" class="report-editor" oninput="markArchiveDirty()"></textarea>
      <div class="report-save-bar">
        <button class="btn-primary block" onclick="saveArchiveFile()">保存</button>
      </div>
    </div>
  </div>

  <div id="archive-status" style="font-size:12px;color:var(--text-faint);margin-top:8px;min-height:1.2em;"></div>
</div>

<script src="js/ui/file-editor.js?v=20260803"></script>
<script src="js/ui/archive.js?v=20260808"></script>
