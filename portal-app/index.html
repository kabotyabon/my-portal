<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!--
    viewport-fit=cover           : env(safe-area-inset-*) を有効にする（全画面 PWA 前提）
    interactive-widget=resizes-content : Android のソフトキーボードでレイアウトビューポート自体を縮める。
      既定の resizes-visual では position:fixed の入力バーがキーボードの裏に回り、
      ブラウザが視覚ビューポートをスクロールして画面全体が上へずれてしまう。
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>My Private Portal</title>
  <script>
    tailwind = {
      config: {
        theme: {
          extend: {
            screens: { tablet: '769px', desktop: '1101px' }
          }
        }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#241A2A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Portal">
  <!-- Styles -->
  <link rel="stylesheet" href="css/base.css?v=20260819">
  <link rel="stylesheet" href="css/components.css?v=20260819">
  <link rel="stylesheet" href="css/ai-chat.css?v=20260815">
  <link rel="stylesheet" href="css/mobile.css?v=20260731">
  <link rel="stylesheet" href="css/theme-companion.css?v=20260819b">
  <link rel="stylesheet" href="css/perxona.css?v=20260921">
</head>
<body class="persona-dashboard">

<!-- テーマを描画ブロック前に適用（FOUC 防止） -->
<script>
  document.body.classList.add('theme-companion');
  document.body.dataset.tab = 'talk';
</script>

<!-- ページ全体のレイアウト（header / analytics / 3カラム / bottom-nav） -->
<div data-partial="partials/layout.html"></div>

<!-- ========== Scripts ========== -->
<!-- Core -->
<script src="js/core/html-loader.js"></script>
<script src="js/core/config.js?v=20260819"></script>
<!-- Perxona Connect Kit（3D アバター＋音声）。avatar-scene.js が参照するので先に読む -->
<script src="js/core/perxona-config.js?v=20260921"></script>
<script src="js/presenter/perxona-stage.js?v=20260921"></script>
<script src="js/core/utils.js"></script>
<!-- Storage Layer -->
<script src="js/storage/github-storage.js?v=20260819"></script>
<script src="js/storage/task-repository.js"></script>
<script src="js/storage/config-repository.js"></script>
<script src="js/storage/diary-repository.js"></script>
<!-- Domain Layer -->
<script src="js/domains/task-service.js?v=20260819"></script>
<script src="js/domains/config-service.js?v=20260731b"></script>
<script src="js/domains/ai-service.js?v=20260815"></script>
<script src="js/domains/diary-service.js?v=20260819"></script>
<script src="js/domains/conversation-log.js?v=20260806"></script>
<!-- 返信候補の押され方を応答スタイルへ還流させる -->
<script src="js/domains/reply-feedback.js?v=20260921"></script>
<!-- 悩みの相談中だけ応答スタイルの締め付けを緩めて深掘りさせる -->
<script src="js/domains/counsel-mode.js?v=20260922"></script>
<!-- ユーザー像と関係の記憶。人格の定義（card.json）とは分ける -->
<script src="js/domains/persona-state.js?v=20260807"></script>
<!-- アバターの表情差分・背景レイヤー。ai-chat.js より先に必要 -->
<script src="js/ui/avatar-scene.js?v=20260819"></script>
<!-- Agent Layer -->
<script src="js/agent/tool-definitions.js?v=20260819"></script>
<script src="js/agent/tool-dispatcher.js?v=20260819"></script>
<!-- Core / API Libs -->
<script src="js/core/github.js?v=20260510"></script>
<script src="js/core/gemini.js?v=20260922b"></script>
<!-- App entry point（ナビ・レイアウト・初期化） -->
<script src="js/core/app.js?v=20260922"></script>

</body>
</html>
